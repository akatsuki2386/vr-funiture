<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Plane Detection</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script>
        AFRAME.registerComponent('plane-detector', {
            init: function() {
                const sceneEl = this.el.sceneEl;
                sceneEl.setAttribute('webxr', 'optionalFeatures: plane-detection');
                this.planes = new Map();
                this.renderer = sceneEl.renderer.xr;
                sceneEl.addEventListener('enter-vr', () => {
                    this.planes.clear();
                    this.el.innerHTML = '';
                });
            },
            tick: function() {
                const xrFrame = this.el.sceneEl.frame;
                if (!xrFrame) return;

                const detectedPlanes = xrFrame.detectedPlanes;
                if (!detectedPlanes) return;

                const referenceSpace = this.renderer.getReferenceSpace();
                
                detectedPlanes.forEach(plane => {
                    if (this.planes.has(plane.uuid)) {
                        return; // 既に描画済み
                    }

                    const pose = xrFrame.getPose(plane.planeSpace, referenceSpace);
                    if (!pose) return;

                    const polygon = plane.polygon;
                    if (polygon.length < 3) return;
                    
                    const vertices = new Float32Array(polygon.flatMap(v => [v.x, v.y, v.z]));
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                    geometry.setIndex(new THREE.BufferAttribute(THREE.ShapeUtils.triangulateShape(polygon, []), 1));

                    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.matrixAutoUpdate = false;
                    mesh.matrix.fromArray(pose.transform.matrix);
                    
                    this.el.object3D.add(mesh);
                    this.planes.set(plane.uuid, mesh);
                });

                detectedPlanes.forEach(plane => {
                    const mesh = this.planes.get(plane.uuid);
                    if (mesh) {
                        const pose = xrFrame.getPose(plane.planeSpace, referenceSpace);
                        if (pose) {
                            mesh.matrix.fromArray(pose.transform.matrix);
                        }
                    }
                });
            }
        });
    </script>
</head>
<body>
    <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: plane-detection">
        <a-entity id="plane-group" plane-detector></a-entity>
        <a-entity camera look-controls></a-entity>
        <a-entity light="type: ambient; color: #888"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-0.5 1 1"></a-entity>
    </a-scene>
</body>
</html>
