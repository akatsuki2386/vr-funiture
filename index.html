<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Both Controllers - Highlight Cube</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        let camera, scene, renderer;
        let controller1, controller2;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // キューブを管理するための配列
        const intersectableObjects = [];
        // 現在ハイライトされているオブジェクトを追跡
        let currentIntersectedObject = null;
        // ハイライト用のマテリアル
        const highlightMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 }); // 緑色で半透明

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local', 'hit-test'] }));

            renderer.xr.addEventListener('sessionstart', () => {
                const controllerModelFactory = new XRControllerModelFactory();

                // 右手コントローラーを取得 (インデックス 0)
                controller1 = renderer.xr.getController(0);
                scene.add(controller1);
                const controllerGrip1 = renderer.xr.getControllerGrip(0);
                controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
                scene.add(controllerGrip1);

                // レイキャストを可視化するための線 (ハイライトロジックとは別で、単なる表示用)
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, -5)
                ]);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
                const line1 = new THREE.Line(lineGeometry, lineMaterial);
                controller1.add(line1);

                // 左手コントローラーを取得 (インデックス 1)
                controller2 = renderer.xr.getController(1);
                scene.add(controller2);
                const controllerGrip2 = renderer.xr.getControllerGrip(1);
                controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
                scene.add(controllerGrip2);
                const line2 = new THREE.Line(lineGeometry, lineMaterial);
                controller2.add(line2);

                // 両方のコントローラーにイベントリスナーを追加 (キューブ生成用)
                controller1.addEventListener('select', onSelect);
                controller2.addEventListener('select', onSelect);
            });

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
        }

        // キューブ生成用関数
        function onSelect() {
            if (reticle.visible) {
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshNormalMaterial(); // キューブ生成時のデフォルトマテリアル
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.setFromMatrixPosition(reticle.matrix);
                
                // 元のマテリアルを保存しておく
                mesh.userData.originalMaterial = material; 
                scene.add(mesh);
                intersectableObjects.push(mesh); // 検出対象の配列に追加
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            if (frame) {
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function () {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const referenceSpace = renderer.xr.getReferenceSpace();
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }

                // --- レイキャストによるオブジェクトのハイライト処理 ---
                let controllerIntersected = false; // どちらかのコントローラーがオブジェクトに当たったか

                // コントローラー1のレイキャスト
                if (controller1) {
                    const tempMatrix = new THREE.Matrix4();
                    tempMatrix.identity().extractRotation(controller1.matrixWorld);
                    const raycaster1 = new THREE.Raycaster();
                    raycaster1.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
                    raycaster1.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                    const intersects1 = raycaster1.intersectObjects(intersectableObjects);

                    if (intersects1.length > 0) {
                        const intersectedObject = intersects1[0].object;
                        if (intersectedObject.geometry instanceof THREE.BoxGeometry) {
                            if (currentIntersectedObject && currentIntersectedObject !== intersectedObject) {
                                // 以前ハイライトされていたオブジェクトを元に戻す
                                currentIntersectedObject.material = currentIntersectedObject.userData.originalMaterial;
                            }
                            // 新しくハイライトする
                            if (intersectedObject.material !== highlightMaterial) {
                                currentIntersectedObject = intersectedObject;
                                currentIntersectedObject.material = highlightMaterial;
                                console.log('キューブにレイキャストが当たりました！ (Controller 1)');
                            }
                            controllerIntersected = true;
                        }
                    }
                }

                // コントローラー2のレイキャスト (Controller1がヒットしなかった場合のみ処理、または独立して処理)
                // 今回はシンプルに、Controller1がヒットしなかった場合にController2をチェック
                if (!controllerIntersected && controller2) { 
                    const tempMatrix = new THREE.Matrix4();
                    tempMatrix.identity().extractRotation(controller2.matrixWorld);
                    const raycaster2 = new THREE.Raycaster();
                    raycaster2.ray.origin.setFromMatrixPosition(controller2.matrixWorld);
                    raycaster2.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                    const intersects2 = raycaster2.intersectObjects(intersectableObjects);

                    if (intersects2.length > 0) {
                        const intersectedObject = intersects2[0].object;
                        if (intersectedObject.geometry instanceof THREE.BoxGeometry) {
                            if (currentIntersectedObject && currentIntersectedObject !== intersectedObject) {
                                // 以前ハイライトされていたオブジェクトを元に戻す
                                currentIntersectedObject.material = currentIntersectedObject.userData.originalMaterial;
                            }
                            // 新しくハイライトする
                            if (intersectedObject.material !== highlightMaterial) {
                                currentIntersectedObject = intersectedObject;
                                currentIntersectedObject.material = highlightMaterial;
                                console.log('キューブにレイキャストが当たりました！ (Controller 2)');
                            }
                            controllerIntersected = true;
                        }
                    }
                }

                // どちらのコントローラーもオブジェクトに当たっていない場合、ハイライトを解除
                if (!controllerIntersected && currentIntersectedObject) {
                    currentIntersectedObject.material = currentIntersectedObject.userData.originalMaterial;
                    currentIntersectedObject = null;
                }
                // --- レイキャストによるオブジェクトのハイライト処理 終わり ---
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
