<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Plane Detection Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // WebXR Plane Detection Module sample component
        AFRAME.registerComponent('pdetect', {
            init: function() {
                const sceneEl = this.el.sceneEl;
                // optionalFeaturesを設定
                sceneEl.setAttribute("webxr", "optionalFeatures: plane-detection, hit-test");
                this.planes = new Map(); // 検出された平面をMapで管理

                sceneEl.addEventListener("enter-vr", ev => {
                    this.planes.clear(); // セッション開始時にクリア
                });
            },

            tick: function(time, dur) {
                const session = this.el.sceneEl.xrSession;
                if (!session || !session.frame) return;

                const frame = session.frame;
                const planesList = frame.detectedPlanes;

                // 新しい平面をチェックして追加
                planesList.forEach(plane => {
                    if (!this.planes.has(plane.uuid)) {
                        const planeEntity = document.createElement('a-entity');
                        planeEntity.setAttribute('geometry', {
                            primitive: 'plane'
                        });
                        planeEntity.setAttribute('material', {
                            color: '#00ff00',
                            side: 'double',
                            opacity: 0.3,
                            transparent: true
                        });
                        this.el.appendChild(planeEntity);
                        this.planes.set(plane.uuid, planeEntity);
                    }
                });

                // 既存の平面の更新
                this.planes.forEach((entity, uuid) => {
                    const plane = planesList.get(uuid);
                    if (plane) {
                        // 平面の姿勢（ポーズ）を更新
                        const pose = frame.getPose(plane.planeSpace, this.el.sceneEl.renderer.xr.getReferenceSpace());
                        if (pose) {
                            entity.object3D.position.copy(pose.transform.position);
                            entity.object3D.quaternion.copy(pose.transform.orientation);
                        }

                        // ポリゴン（形状）の更新
                        const polygon = plane.polygon;
                        const vertices = [];
                        for (let i = 0; i < polygon.length; i++) {
                            vertices.push(new THREE.Vector3(polygon[i].x, polygon[i].y, polygon[i].z));
                        }
                        
                        // ポリゴンからジオメトリを再構築（より簡潔な方法）
                        const shape = new THREE.Shape(vertices);
                        const geometry = new THREE.ShapeGeometry(shape);
                        entity.setObject3D('mesh', new THREE.Mesh(geometry, entity.components.material.material));
                    }
                });
            }
        });
    </script>
</head>
<body>
    <a-scene webxr="requiredFeatures: hit-test; optionalFeatures: plane-detection;">
        <a-entity pdetect></a-entity>
        <a-camera></a-camera>
    </a-scene>
</body>
</html>
