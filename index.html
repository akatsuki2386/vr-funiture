<!DOCTYPE html>
<html>
  <head>
    <title>WebXR AR Sample</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene
      webxr="requiredFeatures: hit-test, dom-overlay; optionalFeatures: plane-detection;"
      ar-mode="enabled: true;"
      >

      <a-entity
        hit-test-plane
        gltf-model="https://cdn.aframe.io/examples/ar/gears.glb"
        scale="0.5 0.5 0.5"
        position="0 0 -5"
        ></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <div id="ui" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px; border-radius: 5px; z-index: 1000;">
        <button onclick="document.querySelector('a-scene').exitAR()">Exit AR</button>
      </div>

    </a-scene>
  </body>
</html>
