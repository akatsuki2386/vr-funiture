<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebXR VR Demo</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-family: sans-serif;
            text-align: center;
            z-index: 10;
        }
        #startButton {
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">
        <p>
            VRゴーグルを装着してください。<br>
            「VRスタート」ボタンを押すと、仮想空間に入ります。
        </p>
        <button id="startButton">VRスタート</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, xrSession;

        // VRスタートボタンのイベントリスナー
        document.getElementById('startButton').addEventListener('click', async () => {
            if (navigator.xr) {
                try {
                    // 'immersive-vr'セッションを要求
                    xrSession = await navigator.xr.requestSession('immersive-vr');
                    
                    // レンダラー、シーン、カメラのセットアップ
                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.body.appendChild(renderer.domElement);
                    renderer.xr.enabled = true;
                    renderer.xr.setSession(xrSession);

                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    
                    // シンプルな仮想空間の作成
                    // 青空
                    scene.background = new THREE.Color(0x87ceeb);

                    // 床
                    const floorGeometry = new THREE.PlaneGeometry(100, 100);
                    const floorMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
                    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                    floor.rotation.x = Math.PI / 2;
                    scene.add(floor);

                    // レンダリングループを開始
                    renderer.setAnimationLoop(onRender);

                } catch (error) {
                    console.error('WebXR session failed:', error);
                    alert('WebXRセッションを開始できませんでした。VRゴーグルが接続されているか確認してください。');
                }
            } else {
                alert('このブラウザはWebXRに対応していません。Meta Quest 3sのブラウザでお試しください。');
            }
        });

        // レンダリングループ
        function onRender(timestamp, frame) {
            if (renderer.xr.isPresenting) {
                // VRセッション中はレンダラーがカメラを自動的に更新
                renderer.render(scene, camera);
            }
        }
        
        // ウィンドウサイズ変更時のリサイズ処理
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
