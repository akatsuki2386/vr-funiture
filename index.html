<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Meta Quest 3 WebXR 平面検出デモ</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #start-ar {
      position: absolute;
      z-index: 10;
      top: 20px; left: 20px;
      font-size: 2em;
      padding: 0.5em 1em;
    }
  </style>
</head>
<body>
  <button id="start-ar">AR開始</button>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.152.2/build/three.module.js";

    let xrSession = null;
    let xrRefSpace = null;
    let renderer, scene, camera;
    let detectedPlanes = new Map();

    function initThree() {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.xr.enabled = true;
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
    }

    function drawPlane(xrPlane, planeMesh, planePose) {
      // XRPlaneのpolygonはローカル座標系で2D (x, z) の配列
      const polygon = xrPlane.polygon;
      if (!polygon || polygon.length < 6) return planeMesh;

      // 2Dポリゴンを3D座標に変換
      const vertices = [];
      for (let i = 0; i < polygon.length; i += 2) {
        vertices.push(new THREE.Vector3(polygon[i], 0, polygon[i + 1]));
      }

      // ポリゴンを三角形に分割
      const indices = [];
      for (let i = 1; i < vertices.length - 1; ++i) {
        indices.push(0, i, i + 1);
      }

      let geometry = new THREE.BufferGeometry().setFromPoints(vertices);
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      if (!planeMesh) {
        const material = new THREE.MeshBasicMaterial({
          color: 0x00ff00,
          opacity: 0.3,
          transparent: true,
          side: THREE.DoubleSide
        });
        planeMesh = new THREE.Mesh(geometry, material);
        scene.add(planeMesh);
      } else {
        planeMesh.geometry.dispose();
        planeMesh.geometry = geometry;
      }

      // XRPlaneの座標系からThree.jsのワールド座標系に反映
      if (planePose) {
        planeMesh.matrix.fromArray(planePose.transform.matrix);
        planeMesh.matrix.decompose(planeMesh.position, planeMesh.quaternion, planeMesh.scale);
      }
      planeMesh.visible = true;
      return planeMesh;
    }

    function onXRFrame(time, frame) {
      let session = frame.session;
      session.requestAnimationFrame(onXRFrame);

      renderer.setSize(window.innerWidth, window.innerHeight);

      // WebXR Plane Detection API
      const worldInfo = frame.worldInformation;
      const planes = worldInfo ? worldInfo.detectedPlanes : null;
      if (planes) {
        // Remove old planes
        detectedPlanes.forEach((mesh, plane) => {
          if (!planes.has(plane)) {
            mesh.visible = false;
            scene.remove(mesh);
            detectedPlanes.delete(plane);
          }
        });
        // Update or add new planes
        for (let plane of planes) {
          let mesh = detectedPlanes.get(plane);
          const planePose = frame.getPose(plane.planeSpace, xrRefSpace);
          if (planePose) {
            mesh = drawPlane(plane, mesh, planePose);
            if (mesh) detectedPlanes.set(plane, mesh);
          }
        }
      }

      renderer.render(scene, camera);
    }

    async function startXR() {
      if (!navigator.xr) {
        alert('WebXR未対応です');
        return;
      }
      try {
        xrSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local', 'plane-detection'],
          planeDetectionState: { enabled: true, detectionMode: 'horizontal' }
        });
      } catch (e) {
        alert('ARセッション開始失敗: ' + e);
        return;
      }

      xrRefSpace = await xrSession.requestReferenceSpace('local');
      renderer.xr.setReferenceSpace(xrRefSpace);
      renderer.xr.setSession(xrSession);

      xrSession.requestAnimationFrame(onXRFrame);
      document.getElementById('start-ar').style.display = 'none';
    }

    initThree();
    document.getElementById('start-ar').onclick = startXR;
  </script>
</body>
</html>
