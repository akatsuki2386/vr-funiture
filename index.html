<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Plane Detection Demo</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let trackedPlanes = new Map();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local', 'plane-detection'] }));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const detectedPlanes = frame.detectedPlanes;

                // 検出された平面を処理
                for (const plane of detectedPlanes) {
                    // 新しい平面か、すでに追跡している平面かをチェック
                    if (!trackedPlanes.has(plane.uuid)) {
                        // 新しい平面を可視化
                        const geometry = new THREE.ShapeGeometry(createPlaneShape(plane.polygon));
                        const material = new THREE.MeshBasicMaterial({
                            color: 0x00ff00, // 緑色
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.5
                        });
                        const mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);
                        trackedPlanes.set(plane.uuid, mesh);
                    }
                    
                    const mesh = trackedPlanes.get(plane.uuid);
                    // 平面の位置と向きを更新
                    mesh.matrix.fromArray(plane.getPose(referenceSpace).transform.matrix);
                }
            }

            renderer.render(scene, camera);
        }

        function createPlaneShape(points) {
            const shape = new THREE.Shape();
            shape.moveTo(points[0].x, points[0].z); // WebXRの平面はY軸が上方向
            for (let i = 1; i < points.length; i++) {
                shape.lineTo(points[i].x, points[i].z);
            }
            return shape;
        }
    </script>
</body>
</html>
