<!DOCTYPE html>
<html>
<head>
    <title>WebXR AR with All Inputs & Joint Tracking (Custom Hands)</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        let camera, scene, renderer;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let hand1, hand2;
        let laser1, laser2;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test', 'hand-tracking'] });
            document.body.appendChild(arButton);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            const reticleGeometry = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            setupControllers();
            setupHands();

            window.addEventListener('resize', onWindowResize, false);
        }

        function setupControllers() {
            controller1 = renderer.xr.getController(0);
            controller2 = renderer.xr.getController(1);

            const controllerModelFactory = new XRControllerModelFactory();
            
            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            const laserGeometry = new THREE.CylinderGeometry(0.002, 0.002, 1, 32).rotateX(Math.PI / 2);
            const laserMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
            
            laser1 = new THREE.Mesh(laserGeometry, laserMaterial);
            laser1.position.set(0, 0, -0.5);
            controller1.add(laser1);

            laser2 = new THREE.Mesh(laserGeometry, laserMaterial);
            laser2.position.set(0, 0, -0.5);
            controller2.add(laser2);

            controller1.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectstart', onSelectStart);
        }

        function setupHands() {
            hand1 = renderer.xr.getHand(0);
            hand2 = renderer.xr.getHand(1);

            const handModelFactory = new XRHandModelFactory();
            
            // HandModelを読み込み、そのメッシュのマテリアルをカスタマイズする
            // 'joints'モードでモデルを生成し、ロード後にマテリアルを変更
            const createCustomHandModel = (hand) => {
                const handModel = handModelFactory.createHandModel(hand, "joints");
                // モデルが完全にロードされた後にマテリアルを変更するため、ロードイベントを待つ
                handModel.traverse(child => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshBasicMaterial({ 
                            color: 0x000000, // 黒色
                            transparent: true,
                            opacity: 0.5, // 半透明
                            side: THREE.DoubleSide // 両面表示
                        });
                    }
                });
                return handModel;
            };

            hand1.add(createCustomHandModel(hand1));
            hand2.add(createCustomHandModel(hand2));

            hand1.addEventListener('pinchend', onPinchEnd);
            hand2.addEventListener('pinchend', onPinchEnd);
        }

        function onSelectStart(event) {
            if (reticle.visible) {
                placeCube();
            }
        }

        function onPinchEnd(event) {
            if (reticle.visible) {
                placeCube();
            }
        }

        function placeCube() {
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            
            cube.position.setFromMatrixPosition(reticle.matrix);
            scene.add(cube);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                if (!hitTestSourceRequested) {
                    const session = renderer.xr.getSession();
                    session.requestHitTestSource({ space: session.viewerSpace })
                        .then(source => {
                            hitTestSource = source;
                        });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    let hit = null;

                    // コントローラーがアクティブな場合は、そのヒットテスト結果を使用
                    // WebXRデバイスは通常、コントローラーが接続されるとハンドトラッキングを自動でオフにするため、
                    // controllerGripのvisibleプロパティで判断するのは妥当です。
                    if (controllerGrip1 && controllerGrip1.visible) {
                        const raycaster1 = new THREE.Raycaster();
                        raycaster1.setFromXRController(controller1, renderer.xr.getReferenceSpace());
                        const controllerHitResults1 = renderer.xr.getSession().requestHitTest(raycaster1.ray, renderer.xr.getReferenceSpace());

                        const raycaster2 = new THREE.Raycaster();
                        raycaster2.setFromXRController(controller2, renderer.xr.getReferenceSpace());
                        const controllerHitResults2 = renderer.xr.getSession().requestHitTest(raycaster2.ray, renderer.xr.getReferenceSpace());

                        if (controllerHitResults1.length > 0) {
                            hit = controllerHitResults1[0];
                            const controllerPose = hit.getPose(renderer.xr.getReferenceSpace());
                            laser1.scale.y = controllerPose.transform.position.distanceTo(controller1.position);
                            laser1.visible = true;
                        } else {
                            laser1.scale.y = 10; // ヒットしない場合は最大距離
                            laser1.visible = true;
                        }
                        
                        if (controllerHitResults2.length > 0) {
                            // どちらかのコントローラーのヒット結果を使えばよい
                            hit = controllerHitResults2[0]; // もし両方ヒットしていたら上書きされる
                            const controllerPose = hit.getPose(renderer.xr.getReferenceSpace());
                            laser2.scale.y = controllerPose.transform.position.distanceTo(controller2.position);
                            laser2.visible = true;
                        } else {
                            laser2.scale.y = 10;
                            laser2.visible = true;
                        }
                    } else if (hitTestResults.length > 0) {
                        // コントローラーがない（ハンドトラッキングが有効な）場合は、ビューポートの中心からのヒットテスト結果を使用
                        hit = hitTestResults[0];
                        if (laser1) laser1.visible = false;
                        if (laser2) laser2.visible = false;
                    } else {
                        // どちらの入力もヒットしない場合
                        if (laser1) laser1.visible = false;
                        if (laser2) laser2.visible = false;
                    }
                    
                    if (hit) {
                        reticle.visible = true;
                        const pose = hit.getPose(renderer.xr.getReferenceSpace());
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
