<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Plane Detection</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="ar-button">Start AR</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let controller;
        let arButton = document.getElementById('ar-button');
        let session = null;
        const planeMeshes = new Map();

        // ------------------ 初期化 ------------------
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // ライトの追加
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);
            
            // ARセッションの開始ボタンの設定
            arButton.addEventListener('click', onARButtonClick);
        }

        // ------------------ ARセッション開始 ------------------
        async function onARButtonClick() {
            if (navigator.xr) {
                try {
                    session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test', 'plane-detection']
                    });
                    
                    renderer.xr.setSession(session);
                    arButton.style.display = 'none';

                    // 参照空間の取得
                    const xrReferenceSpace = await session.requestReferenceSpace('local');

                    // メインループの開始
                    renderer.setAnimationLoop((time, frame) => {
                        if (!frame) return;

                        // 検出された平面を取得
                        const planes = frame.getDetectedPlanes(xrReferenceSpace);

                        // 古い平面を削除
                        planeMeshes.forEach((mesh, plane) => {
                            if (!planes.includes(plane)) {
                                scene.remove(mesh);
                                mesh.geometry.dispose();
                                mesh.material.dispose();
                                planeMeshes.delete(plane);
                            }
                        });

                        // 新しい平面を処理
                        for (const plane of planes) {
                            if (!planeMeshes.has(plane)) {
                                // 新しい平面が検出されたら、その形状に合わせてメッシュを作成
                                const planeGeometry = new THREE.PlaneGeometry(1, 1).fromBufferGeometry(new THREE.BufferGeometry().setFromPoints(plane.polygon.map(point => new THREE.Vector3(point.x, 0, point.z))));
                                const planeMaterial = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff, transparent: true, opacity: 0.5 });
                                const planeMesh = new THREE.Mesh(planeGeometry, planeMaterial);
                                planeMeshes.set(plane, planeMesh);
                                scene.add(planeMesh);
                            }
                            
                            // 平面の姿勢を更新
                            const planePose = frame.getPose(plane.planeSpace, xrReferenceSpace);
                            if (planePose) {
                                const mesh = planeMeshes.get(plane);
                                mesh.matrix.fromArray(planePose.transform.matrix);
                                mesh.matrix.decompose(mesh.position, mesh.quaternion, mesh.scale);
                            }
                        }

                        renderer.render(scene, camera);
                    });
                } catch (e) {
                    console.error("WebXR session failed:", e);
                }
            } else {
                console.error("WebXR is not supported by this browser.");
            }
        }

        // ------------------ リサイズ時の処理 ------------------
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // アプリケーションの開始
        init();
    </script>
</body>
</html>
