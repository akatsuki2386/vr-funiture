<!DOCTYPE html>
<html>
<head>
    <title>Meta Quest 3 AR Example (Single File)</title>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="ar-button">Start AR</button>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js';
        import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/webxr/ARButton.js';

        let container;
        let camera, scene, renderer;
        let controller;
        let cube;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshNormalMaterial();
            cube = new THREE.Mesh(geometry, material);
            
            // WebXRセッションが開始されたらキューブを配置
            renderer.xr.addEventListener('sessionstart', () => {
                // カメラの正面にキューブを配置
                const matrix = new THREE.Matrix4().compose(
                    new THREE.Vector3(0, 0, -0.5),
                    new THREE.Quaternion(),
                    new THREE.Vector3(1, 1, 1)
                );
                cube.applyMatrix4(matrix);
                scene.add(cube);
            });

            // ARボタンの設定
            document.body.appendChild(ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test', 'local-floor'],
                optionalFeatures: ['dom-overlay']
            }));

            // ARセッション内のコントローラーを取得
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);
            
            window.addEventListener('resize', onWindowResize);
        }

        function onSelect() {
            // タップやトリガーの操作時に何か処理を行う
            console.log("Controller selected!");
            // 例: 新しいキューブを生成して配置
            const newCube = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshNormalMaterial());
            newCube.position.setFromMatrixPosition(controller.matrixWorld);
            newCube.quaternion.setFromRotationMatrix(controller.matrixWorld);
            scene.add(newCube);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
