<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Plane Detection with Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="ar-button">Start AR</button>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.149/build/three.module.js';

        let scene, camera, renderer;
        let xrSession = null;

        const arButton = document.getElementById('ar-button');

        // WebXRが利用可能かチェック
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then(isSupported => {
                if (isSupported) {
                    arButton.addEventListener('click', onButtonClick);
                } else {
                    arButton.textContent = 'AR Not Supported';
                    arButton.disabled = true;
                }
            });
        } else {
            arButton.textContent = 'WebXR Not Supported';
            arButton.disabled = true;
        }

        function onButtonClick() {
            if (xrSession === null) {
                // ARセッションを開始
                navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['plane-detection'] })
                    .then(onSessionStarted)
                    .catch(err => {
                        console.error('Failed to start XR session', err);
                    });
            } else {
                xrSession.end();
            }
        }

        function onSessionStarted(session) {
            xrSession = session;
            setupScene();

            xrSession.onend = () => {
                xrSession = null;
                // セッション終了後のクリーンアップ
                arButton.textContent = 'Start AR';
            };

            xrSession.requestAnimationFrame(onXRFrame);
            arButton.textContent = 'Stop AR';
        }

        function setupScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

            // WebGLRendererをARモードで設定
            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            renderer.xr.setSession(xrSession);

            // 平面を可視化するためのマテリアル
            const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true, transparent: true, opacity: 0.5 });
            scene.userData.planes = new Map(); // 検出された平面を格納するMap
            scene.userData.planeMaterial = planeMaterial;

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onXRFrame(time, frame) {
            if (!xrSession) return;

            const session = frame.session;
            const referenceSpace = session.renderState.baseLayer.getXRReferenceSpace();

            const detectedPlanes = frame.detectedPlanes;

            // 既存の平面を更新または削除
            const planesToRemove = new Set(scene.userData.planes.keys());
            for (const plane of detectedPlanes) {
                planesToRemove.delete(plane.uuid);
                
                let planeMesh = scene.userData.planes.get(plane.uuid);
                const polygon = plane.polygon;
                const geometry = new THREE.BufferGeometry().setFromPoints(polygon.map(p => new THREE.Vector3(p.x, p.y, p.z)));
                
                if (planeMesh) {
                    // 既存の平面を更新
                    planeMesh.geometry.dispose(); // 古いジオメトリを破棄
                    planeMesh.geometry = geometry;
                    planeMesh.matrix.fromArray(plane.plane.transform.matrix);
                } else {
                    // 新しい平面を作成
                    planeMesh = new THREE.Mesh(geometry, scene.userData.planeMaterial);
                    planeMesh.matrixAutoUpdate = false;
                    planeMesh.matrix.fromArray(plane.plane.transform.matrix);
                    scene.add(planeMesh);
                    scene.userData.planes.set(plane.uuid, planeMesh);
                }
            }

            // 検出されなくなった平面をシーンから削除
            for (const uuid of planesToRemove) {
                const planeMesh = scene.userData.planes.get(uuid);
                scene.remove(planeMesh);
                planeMesh.geometry.dispose();
                scene.userData.planes.delete(uuid);
            }

            renderer.render(scene, camera);
            session.requestAnimationFrame(onXRFrame);
        }

    </script>
</body>
</html>
