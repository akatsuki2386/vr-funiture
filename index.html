<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Mesh Detection</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script>
        AFRAME.registerComponent('mesh-detector', {
            init: function() {
                const sceneEl = this.el.sceneEl;
                sceneEl.setAttribute('webxr', 'optionalFeatures: mesh-detection');
                this.meshes = new Map();
                this.renderer = sceneEl.renderer.xr;
                sceneEl.addEventListener('enter-vr', () => {
                    this.meshes.clear();
                    this.el.innerHTML = '';
                });
            },
            tick: function() {
                const xrFrame = this.el.sceneEl.frame;
                if (!xrFrame) return;

                const detectedMeshes = xrFrame.detectedMeshes;
                if (!detectedMeshes) return;

                const referenceSpace = this.renderer.getReferenceSpace();

                detectedMeshes.forEach(mesh => {
                    if (this.meshes.has(mesh.uuid)) {
                        return; // 既に描画済み
                    }

                    const pose = xrFrame.getPose(mesh.meshSpace, referenceSpace);
                    if (!pose) return;

                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(mesh.vertices, 3));
                    geometry.setIndex(new THREE.BufferAttribute(mesh.indices, 1));
                    
                    const material = new THREE.MeshBasicMaterial({ 
                        color: Math.random() * 0xffffff, 
                        wireframe: true, 
                        side: THREE.DoubleSide 
                    });
                    const meshObject = new THREE.Mesh(geometry, material);
                    meshObject.matrixAutoUpdate = false;
                    meshObject.matrix.fromArray(pose.transform.matrix);

                    this.el.object3D.add(meshObject);
                    this.meshes.set(mesh.uuid, meshObject);
                });

                detectedMeshes.forEach(mesh => {
                    const meshObject = this.meshes.get(mesh.uuid);
                    if (meshObject) {
                        const pose = xrFrame.getPose(mesh.meshSpace, referenceSpace);
                        if (pose) {
                            meshObject.matrix.fromArray(pose.transform.matrix);
                        }
                    }
                });
            }
        });
    </script>
</head>
<body>
    <a-scene webxr="requiredFeatures: local; optionalFeatures: mesh-detection">
        <a-entity id="mesh-group" mesh-detector></a-entity>
        <a-entity camera look-controls></a-entity>
        <a-entity light="type: ambient; color: #888"></a-entity>
    </a-scene>
</body>
</html>
