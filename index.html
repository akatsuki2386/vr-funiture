<!DOCTYPE html>
<html>
<head>
  <title>WebXR Pass-through Cube</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    /* Fullscreen setup for better VR experience */
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    webxr="requiredFeatures: local-floor, camera-access;"
    ar-mode>

    <a-camera position="0 1.6 0"></a-camera>

    <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9" shadow></a-box>

    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="directional" position="-1 1 1" intensity="0.5"></a-light>

  </a-scene>
</body>
</html>
