<!DOCTYPE html>
<html>
<head>
    <title>WebXR AR with Dual Inputs</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        let camera, scene, renderer;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        // 入力ソース関連の変数
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let hand1, hand2;
        let laser1, laser2;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // コントローラーとハンドトラッキングの両方を要求
            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test', 'hand-tracking'] });
            document.body.appendChild(arButton);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Reticle（リング）の作成
            const reticleGeometry = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // 各コントローラーと手のモデルをセットアップ
            setupControllers();
            setupHands();

            window.addEventListener('resize', onWindowResize, false);
        }

        function setupControllers() {
            // コントローラーの取得
            controller1 = renderer.xr.getController(0);
            controller2 = renderer.xr.getController(1);

            // コントローラーの3Dモデルを読み込む
            const controllerModelFactory = new XRControllerModelFactory();
            
            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            // レイキャストの作成
            const laserGeometry = new THREE.CylinderGeometry(0.002, 0.002, 1, 32).rotateX(Math.PI / 2);
            const laserMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
            
            laser1 = new THREE.Mesh(laserGeometry, laserMaterial);
            laser1.position.set(0, 0, -0.5);
            controller1.add(laser1);

            laser2 = new THREE.Mesh(laserGeometry, laserMaterial);
            laser2.position.set(0, 0, -0.5);
            controller2.add(laser2);

            // イベントリスナーの追加
            controller1.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectstart', onSelectStart);
        }

        function setupHands() {
            // 手の取得
            hand1 = renderer.xr.getHand(0);
            hand2 = renderer.xr.getHand(1);

            // 手のモデルを読み込む
            const handModelFactory = new XRHandModelFactory();

            hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
            hand2.add(handModelFactory.createHandModel(hand2, "mesh"));

            // イベントリスナーの追加
            hand1.addEventListener('pinchend', onPinchEnd);
            hand2.addEventListener('pinchend', onPinchEnd);
        }

        // コントローラーのselectstartイベント
        function onSelectStart(event) {
            if (reticle.visible) {
                placeCube();
            }
        }

        // 手のpinchendイベント
        function onPinchEnd(event) {
            if (reticle.visible) {
                placeCube();
            }
        }

        // オブジェクト配置の共通関数
        function placeCube() {
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            
            cube.position.setFromMatrixPosition(reticle.matrix);
            scene.add(cube);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                if (!hitTestSourceRequested) {
                    const session = renderer.xr.getSession();
                    session.requestHitTestSource({ space: session.viewerSpace })
                        .then(source => {
                            hitTestSource = source;
                        });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    // どの入力ソースが現在利用可能かチェック
                    const inputSources = renderer.xr.getSession().inputSources;
                    let activeController = null;
                    let isHandTracking = false;

                    for (const source of inputSources) {
                        if (source.hand) {
                            isHandTracking = true;
                            // 手のモデルを表示
                            hand1.visible = true;
                            hand2.visible = true;
                            // コントローラーモデルを非表示
                            controllerGrip1.visible = false;
                            controllerGrip2.visible = false;
                            break; // 手が検出されたら終了
                        } else if (source.profiles.includes('oculus-touch')) {
                            activeController = source;
                            // コントローラーモデルを表示
                            controllerGrip1.visible = true;
                            controllerGrip2.visible = true;
                            // 手のモデルを非表示
                            hand1.visible = false;
                            hand2.visible = false;
                        }
                    }

                    // ヒットテストの実行
                    let raycaster = new THREE.Raycaster();
                    let hitTestResults = [];

                    if (isHandTracking) {
                         const indexTip1 = hand1.joints['index-finger-tip'];
                         const thumbTip1 = hand1.joints['thumb-finger-tip'];

                         if (indexTip1 && thumbTip1) {
                             const startPos = new THREE.Vector3().setFromMatrixPosition(indexTip1.matrixWorld);
                             const endPos = new THREE.Vector3().setFromMatrixPosition(thumbTip1.matrixWorld);
                             const direction = new THREE.Vector3().subVectors(endPos, startPos).normalize();
                             raycaster.set(startPos, direction);
                             hitTestResults = renderer.xr.getSession().requestHitTest(raycaster.ray, renderer.xr.getReferenceSpace());
                         }
                    } else if (activeController) {
                        raycaster.setFromXRController(controller1, renderer.xr.getReferenceSpace());
                        hitTestResults = renderer.xr.getSession().requestHitTest(raycaster.ray, renderer.xr.getReferenceSpace());
                        // レイキャストの表示制御
                        if(laser1) laser1.visible = true;
                        if(laser2) laser2.visible = true;
                    } else {
                        // どちらも利用できない場合
                        if(laser1) laser1.visible = false;
                        if(laser2) laser2.visible = false;
                    }

                    // レティクルとレイキャストの更新
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(renderer.xr.getReferenceSpace());
                        
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
