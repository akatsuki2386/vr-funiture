<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Plane Detection Test</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let trackedPlanes = new Map();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // シーンに光源を追加する
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // DirectionalLight (太陽光のような光源)も追加して試す
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 2, 3);
            scene.add(directionalLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local', 'plane-detection'] }));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const detectedPlanes = frame.detectedPlanes;

                // 検出された平面を処理
                for (const plane of detectedPlanes) {
                    if (!trackedPlanes.has(plane.uuid)) {
                        const geometry = new THREE.ShapeGeometry(createPlaneShape(plane.polygon));
                        const material = new THREE.MeshBasicMaterial({
                            color: 0x00ff00,
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.5
                        });
                        const mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);
                        trackedPlanes.set(plane.uuid, mesh);
                    }
                    
                    const mesh = trackedPlanes.get(plane.uuid);
                    mesh.matrix.fromArray(plane.getPose(referenceSpace).transform.matrix);
                }
            }

            renderer.render(scene, camera);
        }

        function createPlaneShape(points) {
            const shape = new THREE.Shape();
            shape.moveTo(points[0].x, points[0].z);
            for (let i = 1; i < points.length; i++) {
                shape.lineTo(points[i].x, points[i].z);
            }
            return shape;
        }
    </script>
</body>
</html>
