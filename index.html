<!DOCTYPE html>
<html>
<head>
    <title>WebXR AR with Hand Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        let camera, scene, renderer;
        let controller1, controller2;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // 手のモデルとジェスチャーのための変数
        let hand1, hand2;
        let pinching = false;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // `hand-tracking`をrequiredFeaturesに追加
            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test', 'hand-tracking'] });
            document.body.appendChild(arButton);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // コントローラーの代わりに手の入力を取得
            controller1 = renderer.xr.getController(0);
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            scene.add(controller2);

            // 手のモデルを読み込む
            const handModelFactory = new XRHandModelFactory();

            hand1 = renderer.xr.getHand(0);
            hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
            hand1.addEventListener('pinchend', onPinchEnd);
            scene.add(hand1);

            hand2 = renderer.xr.getHand(1);
            hand2.add(handModelFactory.createHandModel(hand2, "mesh"));
            hand2.addEventListener('pinchend', onPinchEnd);
            scene.add(hand2);

            // Reticle（リング）の作成
            const reticleGeometry = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize, false);
        }
        
        // ピンチ操作の終了時に実行
        function onPinchEnd(event) {
            const hand = event.target;
            // 指先の位置から光線を投射する
            const indexTip = hand.joints['index-finger-tip'];
            const thumbTip = hand.joints['thumb-finger-tip'];

            if (!indexTip || !thumbTip) return;

            const raycaster = new THREE.Raycaster();
            const startPos = new THREE.Vector3().setFromMatrixPosition(indexTip.matrixWorld);
            const endPos = new THREE.Vector3().setFromMatrixPosition(thumbTip.matrixWorld);
            const direction = new THREE.Vector3().subVectors(endPos, startPos).normalize();
            
            raycaster.set(startPos, direction);

            const hitTestResults = renderer.xr.getSession().requestHitTest(
                raycaster.ray,
                renderer.xr.getReferenceSpace()
            );

            hitTestResults.then(results => {
                if (results.length > 0) {
                    const hit = results[0];
                    const pose = hit.getPose(renderer.xr.getReferenceSpace());
                    const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.setFromMatrixPosition(pose.transform.matrix);
                    scene.add(cube);
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                if (!hitTestSourceRequested) {
                    const session = renderer.xr.getSession();
                    session.requestHitTestSource({ space: session.viewerSpace })
                        .then(source => {
                            hitTestSource = source;
                        });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(renderer.xr.getReferenceSpace());
                        
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
