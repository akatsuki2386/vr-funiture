<!DOCTYPE html>
<html>
<head>
  <title>WebXR Passthrough AR</title>
</head>
<body>
  <h1>WebXR Passthrough AR</h1>
  <button id="startButton">Start AR</button>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.module.js';

    let scene, camera, renderer;
    let passthrough;

    // ボタンのクリックイベント
    document.getElementById('startButton').addEventListener('click', async () => {
      if ('xr' in navigator) {
        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            optionalFeatures: ['dom-overlay', 'unbounded', 'plane-detection', 'hit-test', 'local-floor'],
            requiredFeatures: ['hit-test']
          });

          // THREE.jsのセットアップ
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          document.body.appendChild(renderer.domElement);

          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

          // ARセッションの開始
          renderer.xr.enabled = true;
          renderer.xr.setReferenceSpaceType('local');
          renderer.xr.setSession(session);

          // パススルーAPIの有効化
          if (session.isPassthrough) {
            passthrough = new XRWebGLLayer(session, gl);
            session.updatePassthrough(true); // パススルーを有効にする
          }

          // アニメーションループ
          renderer.setAnimationLoop(() => {
            if (passthrough) {
              passthrough.update();
            }
            renderer.render(scene, camera);
          });

        } catch (error) {
          console.error('An error occurred:', error);
        }
      } else {
        console.warn('WebXR not supported in this browser.');
      }
    });
  </script>
</body>
</html>
