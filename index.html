<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Object Manipulation</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        let camera, scene, renderer;
        let controller1;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let objectRaycaster;
        const placedObjects = [];
        let isDeleting = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local', 'hit-test'] }));

            renderer.xr.addEventListener('sessionstart', () => {
                const controllerModelFactory = new XRControllerModelFactory();

                // 右手コントローラーを取得 (インデックス 0)
                controller1 = renderer.xr.getController(0);
                scene.add(controller1);
                const controllerGrip1 = renderer.xr.getControllerGrip(0);
                controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
                scene.add(controllerGrip1);

                // レイキャストを可視化するための線
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, -5)
                ]);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
                const line1 = new THREE.Line(lineGeometry, lineMaterial);
                controller1.add(line1);

                // オブジェクト配置イベント
                controller1.addEventListener('select', onSelect);
                
                // オブジェクト削除イベント
                controller1.addEventListener('end', onEnd);
            });

            // オブジェクト用レイキャスター
            objectRaycaster = new THREE.Raycaster();

            // レティクル
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
        }

        function onSelect() {
            if (reticle.visible) {
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshNormalMaterial();
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.setFromMatrixPosition(reticle.matrix);
                scene.add(mesh);
                placedObjects.push(mesh);
            }
        }

        function onEnd(event) {
            // Aボタン (xr-standard-button) が離されたときに削除
            if (event.inputSource.gamepad.buttons[4].pressed === false) { // Aボタンはインデックス4
                if (isDeleting) {
                    const intersects = objectRaycaster.intersectObjects(placedObjects);
                    if (intersects.length > 0) {
                        const objectToDelete = intersects[0].object;
                        scene.remove(objectToDelete);
                        const index = placedObjects.indexOf(objectToDelete);
                        if (index > -1) {
                            placedObjects.splice(index, 1);
                        }
                    }
                }
                isDeleting = false;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            if (frame) {
                const session = renderer.xr.getSession();

                // Hit-testのロジック (変更なし)
                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function () {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const referenceSpace = renderer.xr.getReferenceSpace();
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
                
                // オブジェクトのレイキャスト
                if (controller1) {
                    const controllerPos = new THREE.Vector3().setFromMatrixPosition(controller1.matrixWorld);
                    const controllerDir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller1.quaternion);
                    objectRaycaster.set(controllerPos, controllerDir);

                    const intersects = objectRaycaster.intersectObjects(placedObjects);

                    // Aボタンが押されたら削除モード
                    if (controller1.gamepad && controller1.gamepad.buttons[4].pressed) {
                        isDeleting = true;
                    }

                    // オブジェクトに当たったときの視覚的なフィードバック (色を変える)
                    if (intersects.length > 0) {
                        const intersectedObject = intersects[0].object;
                        if (intersectedObject.currentHex === undefined) {
                            intersectedObject.currentHex = intersectedObject.material.emissive.getHex();
                            intersectedObject.material.emissive.setHex(0xff0000); // 赤色にハイライト
                        }
                    } else {
                        // オブジェクトから離れたら色を元に戻す
                        placedObjects.forEach(obj => {
                            if (obj.currentHex !== undefined) {
                                obj.material.emissive.setHex(obj.currentHex);
                                delete obj.currentHex;
                            }
                        });
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
