<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Starter for Meta Quest 3</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }
        #start-button {
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s;
        }
        #start-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <button id="start-button">VRを開始</button>
    </div>
    <canvas id="xr-canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { XRButton } from 'three/addons/webxr/XRButton.js';

        const overlay = document.getElementById('overlay');
        const startButton = document.getElementById('start-button');
        const canvas = document.getElementById('xr-canvas');

        let scene, camera, renderer, cube;

        function init() {
            // シーン、カメラ、レンダラーのセットアップ
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: canvas });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local-floor');

            // 3Dオブジェクトを追加
            const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const material = new THREE.MeshNormalMaterial();
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            cube.position.set(0, 1.5, -2); // ユーザーの目の前に配置

            // ライトを追加
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // ウィンドウサイズ変更時の処理
            window.addEventListener('resize', onWindowResize);

            // **XRButtonを最初から作成し、既存のボタンに置き換える**
            if (navigator.xr) {
                // XRButton.createButtonはWebXRセッションを開始するためのDOM要素を返します。
                const xrButtonElement = XRButton.createButton(renderer, 'immersive-vr');
                xrButtonElement.id = 'start-button'; // スタイルを適用するためIDを設定
                
                // 既存のボタンを新しいXRボタンに置き換える
                overlay.replaceChild(xrButtonElement, startButton);

                // XRセッションが終了したときにオーバーレイを再表示する
                renderer.xr.addEventListener('sessionend', () => {
                    overlay.style.display = 'flex';
                });
            } else {
                // WebXRがサポートされていない場合
                startButton.textContent = 'WebXRはサポートされていません';
                startButton.disabled = true;
                startButton.style.backgroundColor = '#888';
            }
        }

        function animate(timestamp, frame) {
            // オブジェクトを回転させる例
            if (cube) {
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 初期化処理を実行
        init();

        // アニメーションループを開始
        renderer.setAnimationLoop(animate);
    </script>
</body>
</html>
