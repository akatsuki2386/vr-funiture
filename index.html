<!DOCTYPE html>
<html>
<head>
    <title>WebXR AR for Smart Glasses</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ar-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: sans-serif;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            display: none; /* 初期状態ではボタンを非表示 */
        }
    </style>
</head>
<body>
    <button id="ar-button">START AR</button>
    <script src="main.js"></script>
</body>
</html>
