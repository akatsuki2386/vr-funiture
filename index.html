<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Passthrough Placement Demo</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller1;
        let raycaster;

        // オブジェクトを配置するためのマーカー
        const reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.15, 0.2, 32).rotateX(- Math.PI / 2),
            new THREE.MeshBasicMaterial()
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;

        init();
        animate();

        function init() {
            // シーンとカメラ
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // レンダラー
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ARセッションを開始するためのボタン
            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test', 'anchors'] }));

            // コントローラー
            controller1 = renderer.xr.getController(0);
            scene.add(controller1);

            // レイキャスト
            raycaster = new THREE.Raycaster();

            // コントローラーのレイを視覚化
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, -1)
                ])
            );
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line);

            // レイキャストがヒットした場所に表示するマーカーを追加
            scene.add(reticle);

            // オブジェクト配置イベント
            controller1.addEventListener('selectstart', onSelect);

            window.addEventListener('resize', onWindowResize);
        }

        function onSelect() {
            if (reticle.visible) {
                // レイキャストがヒットした場所に新しい立方体を追加
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff * Math.random() });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.setFromMatrixPosition(reticle.matrix);
                scene.add(mesh);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            if (frame) {
                const session = renderer.xr.getSession();

                // レイキャストが現実空間の平面に当たったかを検出
                const referenceSpace = renderer.xr.getReferenceSpace();
                const hitTestResults = frame.getHitTestResults(session.hitTestSource);

                if (hitTestResults.length) {
                    const hit = hitTestResults[0];
                    reticle.visible = true;
                    reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                } else {
                    reticle.visible = false;
                }
            }

            // コントローラーの位置と向きを更新
            if (controller1) {
                controller1.matrix.fromArray(controller1.getPose(renderer.xr.getReferenceSpace()).transform.matrix);
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
