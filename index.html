<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Plane Detection AR</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="ar-button">Start AR</button>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer, controller;

        const planes = new Map();
        const planeMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(1, 1);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test', 'plane-detection'] }));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();
                if (session) {
                    const detectedPlanes = session.getDetectedPlanes();
                    for (const plane of detectedPlanes) {
                        if (!planes.has(plane.plane.uuid)) {
                            const newPlane = createPlaneMesh(plane.plane);
                            scene.add(newPlane);
                            planes.set(plane.plane.uuid, newPlane);
                        }
                        updatePlaneMesh(planes.get(plane.plane.uuid), plane.plane);
                    }
                    for (const [uuid, mesh] of planes.entries()) {
                        let planeFound = false;
                        for (const plane of detectedPlanes) {
                            if (plane.plane.uuid === uuid) {
                                planeFound = true;
                                break;
                            }
                        }
                        if (!planeFound) {
                            scene.remove(mesh);
                            planes.delete(uuid);
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function createPlaneMesh(plane) {
            const mesh = new THREE.Mesh(planeGeometry, planeMaterial);
            mesh.matrixAutoUpdate = false;
            return mesh;
        }

        function updatePlaneMesh(mesh, plane) {
            mesh.matrix.fromArray(plane.transform.matrix);
            const polygon = plane.polygon;
            const vertices = [];
            for (let i = 0; i < polygon.length; i++) {
                vertices.push(new THREE.Vector2(polygon[i].x, polygon[i].z));
            }
            const shape = new THREE.Shape(vertices);
            mesh.geometry.dispose();
            mesh.geometry = new THREE.ShapeGeometry(shape);
        }
    </script>
</body>
</html>
