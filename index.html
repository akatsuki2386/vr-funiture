<!DOCTYPE html>
<html>
<head>
    <title>WebXR 平面検出</title>
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let planes = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialiasing: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;

            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['plane-detection'] }));

            controller = renderer.xr.getController(0);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();

                if (session) {
                    if (!hitTestSourceRequested) {
                        session.Animate(render);
                        return;
                    }

                    const referenceSpace = renderer.xr.getReferenceSpace();
                    const detectedPlanes = session.getDetectedPlanes();

                    // 既存の平面メッシュをすべて削除
                    for (const mesh of planes) {
                        scene.remove(mesh);
                    }
                    planes = [];

                    // 検出された平面ごとにメッシュを作成
                    for (const plane of detectedPlanes) {
                        const planePose = frame.getPose(plane.plane, referenceSpace);
                        if (planePose) {
                            const polygon = plane.polygon;
                            const vertices = new Float32Array(polygon.length * 3);
                            for (let i = 0; i < polygon.length; i++) {
                                vertices[i * 3] = polygon[i].x;
                                vertices[i * 3 + 1] = polygon[i].y;
                                vertices[i * 3 + 2] = polygon[i].z;
                            }

                            const geometry = new THREE.BufferGeometry();
                            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                            geometry.computeVertexNormals();

                            const material = new THREE.MeshBasicMaterial({
                                color: 0x00ff00,
                                transparent: true,
                                opacity: 0.5,
                                side: THREE.DoubleSide
                            });
                            const mesh = new THREE.Mesh(geometry, material);
                            mesh.position.copy(planePose.transform.position);
                            mesh.quaternion.copy(planePose.transform.orientation);
                            scene.add(mesh);
                            planes.push(mesh);
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
