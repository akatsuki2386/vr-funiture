<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Furniture Placement Demo</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="ar-button">Start AR</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let controller;
        let arButton = document.getElementById('ar-button');
        let session = null;
        let xrReferenceSpace, hitTestSource;
        let hitTestMarker;

        // ------------------ 初期化 ------------------
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // ライトの追加
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);
            
            // ヒットテストのマーカー（配置ガイド）
            hitTestMarker = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.1, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 })
            );
            hitTestMarker.visible = false;
            scene.add(hitTestMarker);
            
            // ARセッションの開始ボタンの設定
            arButton.addEventListener('click', onARButtonClick);

            // コントローラーの設定
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);
        }

        // ------------------ ARセッション開始 ------------------
        async function onARButtonClick() {
            if (navigator.xr) {
                try {
                    session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test']
                    });
                    
                    renderer.xr.setSession(session);
                    arButton.style.display = 'none';

                    // 参照空間とヒットテストソースの取得
                    xrReferenceSpace = await session.requestReferenceSpace('local');
                    hitTestSource = await session.requestHitTestSource({ space: xrReferenceSpace });

                    // メインループの開始
                    renderer.setAnimationLoop(onXRFrame);
                } catch (e) {
                    console.error("WebXR session failed:", e);
                }
            } else {
                console.error("WebXR is not supported by this browser.");
            }
        }

        // ------------------ XRフレームごとの処理 ------------------
        function onXRFrame(time, frame) {
            if (!frame) return;

            // ヒットテストの実行
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
                const hitPose = hitTestResults[0].getPose(xrReferenceSpace);
                hitTestMarker.matrix.fromArray(hitPose.transform.matrix);
                hitTestMarker.matrix.decompose(hitTestMarker.position, hitTestMarker.quaternion, hitTestMarker.scale);
                hitTestMarker.visible = true;
            } else {
                hitTestMarker.visible = false;
            }

            renderer.render(scene, camera);
        }

        // ------------------ コントローラーでの選択イベント ------------------
        function onSelect() {
            if (hitTestMarker.visible) {
                // 新しい家具モデル（ここでは単純なボックス）を配置
                const furniture = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.5),
                    new THREE.MeshStandardMaterial({ color: 0x8844aa })
                );
                // マーカーの位置に配置
                furniture.position.copy(hitTestMarker.position);
                furniture.quaternion.copy(hitTestMarker.quaternion);
                scene.add(furniture);
            }
        }

        // ------------------ リサイズ時の処理 ------------------
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // アプリケーションの開始
        init();
    </script>
</body>
</html>
