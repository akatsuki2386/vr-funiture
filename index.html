// A-Frameを使うため、CDNを読み込む
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script>
  // WebXR Plane Detectionのコンポーネント
  AFRAME.registerComponent('webxr-plane-detection', {
    init: function () {
      this.el.sceneEl.addEventListener('enter-vr', () => {
        // VRモードに入ったときに、平面検出を有効にする
        const session = this.el.sceneEl.renderer.xr.getSession();
        session.requestReferenceSpace('local-floor').then((refSpace) => {
          this.refSpace = refSpace;
          session.requestAnimationFrame((t, frame) => {
            this.update(frame);
          });
        });
      });
    },

    update: function (frame) {
      if (!this.refSpace || !frame) {
        return;
      }

      // 検出された平面を取得
      const detectedPlanes = frame.getDetectedPlanes();

      detectedPlanes.forEach((plane) => {
        // 新しい平面、または更新された平面を処理
        // ここでは、平面に可視化用のメッシュを追加する
        const planeEl = document.createElement('a-entity');
        planeEl.setAttribute('geometry', {
          primitive: 'plane',
          width: plane.polygon.bounds.width,
          height: plane.polygon.bounds.height
        });
        planeEl.setAttribute('material', {
          color: '#87CEEB',
          side: 'double',
          opacity: 0.5
        });

        // 平面の位置と向きを更新
        const pose = frame.getPose(plane.planeSpace, this.refSpace);
        if (pose) {
          planeEl.object3D.position.copy(pose.transform.position);
          planeEl.object3D.quaternion.copy(pose.transform.orientation);
        }

        // シーンに追加
        this.el.sceneEl.appendChild(planeEl);
      });
    }
  });
</script>

<a-scene webxr-plane-detection>
  <a-entity camera></a-entity>
</a-scene>
