<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebXR Placement Demo</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        let camera, scene, renderer;
        let controller1;
        let raycaster;
        let reticle;
        const placeablePlanes = [];
        const trackedPlanes = new Map();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['local', 'plane-detection'] }));

            const controllerModelFactory = new XRControllerModelFactory();

            // コントローラー1（右）
            controller1 = renderer.xr.getController(0);
            scene.add(controller1);
            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            // レイキャストを可視化するための線
            const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -5)
            ]);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
            const line1 = new THREE.Line(lineGeometry, lineMaterial);
            controller1.add(line1);

            // レイキャスト
            raycaster = new THREE.Raycaster();

            // レティクル
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // オブジェクト配置イベント
            controller1.addEventListener('select', onSelect);

            window.addEventListener('resize', onWindowResize);
        }

        function onSelect() {
            if (reticle.visible) {
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshNormalMaterial();
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.setFromMatrixPosition(reticle.matrix);
                scene.add(mesh);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const detectedPlanes = frame.detectedPlanes;

                // 検出された平面を更新
                for (const plane of detectedPlanes) {
                    if (!trackedPlanes.has(plane.uuid)) {
                        const geometry = new THREE.ShapeGeometry(createPlaneShape(plane.polygon));
                        const material = new THREE.MeshBasicMaterial({
                            color: 0x00ff00,
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.0 // 可視化しないため透明に
                        });
                        const mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);
                        placeablePlanes.push(mesh);
                        trackedPlanes.set(plane.uuid, mesh);
                    }
                    
                    const mesh = trackedPlanes.get(plane.uuid);
                    mesh.matrix.fromArray(plane.getPose(referenceSpace).transform.matrix);
                }

                // レイキャストの更新
                if (controller1) {
                    const controllerPos = new THREE.Vector3().setFromMatrixPosition(controller1.matrixWorld);
                    const controllerDir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller1.quaternion);
                    raycaster.set(controllerPos, controllerDir);

                    // レイキャストと平面との交差判定
                    const intersects = raycaster.intersectObjects(placeablePlanes);

                    if (intersects.length > 0) {
                        reticle.visible = true;
                        reticle.position.copy(intersects[0].point);
                        reticle.quaternion.copy(intersects[0].object.quaternion);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function createPlaneShape(points) {
            const shape = new THREE.Shape();
            shape.moveTo(points[0].x, points[0].z);
            for (let i = 1; i < points.length; i++) {
                shape.lineTo(points[i].x, points[i].z);
            }
            return shape;
        }
    </script>
</body>
</html>
