<!DOCTYPE html>
<html>
<head>
    <title>WebXR AR with Dual Inputs & Raycast</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        let camera, scene, renderer;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let hand1, hand2;
        let laser1, laser2;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test', 'hand-tracking'] });
            document.body.appendChild(arButton);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Reticle（リング）の作成
            const reticleGeometry = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // コントローラーと手のモデルをセットアップ
            setupControllers();
            setupHands();

            window.addEventListener('resize', onWindowResize, false);
        }

        function setupControllers() {
            controller1 = renderer.xr.getController(0);
            controller2 = renderer.xr.getController(1);

            const controllerModelFactory = new XRControllerModelFactory();
            
            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            const laserGeometry = new THREE.CylinderGeometry(0.002, 0.002, 1, 32).rotateX(Math.PI / 2);
            const laserMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
            
            laser1 = new THREE.Mesh(laserGeometry, laserMaterial);
            laser1.position.set(0, 0, -0.5);
            controller1.add(laser1);
            laser1.visible = false; // 初期状態では非表示

            laser2 = new THREE.Mesh(laserGeometry, laserMaterial);
            laser2.position.set(0, 0, -0.5);
            controller2.add(laser2);
            laser2.visible = false; // 初期状態では非表示

            controller1.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectstart', onSelectStart);
        }

        function setupHands() {
            hand1 = renderer.xr.getHand(0);
            hand2 = renderer.xr.getHand(1);

            const handModelFactory = new XRHandModelFactory();
            hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
            hand2.add(handModelFactory.createHandModel(hand2, "mesh"));
            
            // 初期状態では手のモデルを非表示
            hand1.visible = false;
            hand2.visible = false;

            hand1.addEventListener('pinchend', onPinchEnd);
            hand2.addEventListener('pinchend', onPinchEnd);
        }

        function onSelectStart(event) {
            if (reticle.visible) {
                placeCube();
            }
        }

        function onPinchEnd(event) {
            if (reticle.visible) {
                placeCube();
            }
        }

        function placeCube() {
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            
            cube.position.setFromMatrixPosition(reticle.matrix);
            scene.add(cube);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                if (!hitTestSourceRequested) {
                    const session = renderer.xr.getSession();
                    session.requestHitTestSource({ space: session.viewerSpace })
                        .then(source => {
                            hitTestSource = source;
                        });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const inputSources = renderer.xr.getSession().inputSources;
                    let activeInput = 'none';

                    // どの入力がアクティブか判断
                    for (const source of inputSources) {
                        if (source.hand) {
                            activeInput = 'hand';
                            break;
                        } else if (source.profiles.includes('oculus-touch')) {
                            activeInput = 'controller';
                            break;
                        }
                    }

                    // モデルとレイキャストの表示を切り替え
                    if (activeInput === 'hand') {
                        if(controllerGrip1) controllerGrip1.visible = false;
                        if(controllerGrip2) controllerGrip2.visible = false;
                        if(laser1) laser1.visible = false;
                        if(laser2) laser2.visible = false;
                        if(hand1) hand1.visible = true;
                        if(hand2) hand2.visible = true;
                    } else if (activeInput === 'controller') {
                        if(controllerGrip1) controllerGrip1.visible = true;
                        if(controllerGrip2) controllerGrip2.visible = true;
                        if(hand1) hand1.visible = false;
                        if(hand2) hand2.visible = false;
                    } else {
                        if(controllerGrip1) controllerGrip1.visible = false;
                        if(controllerGrip2) controllerGrip2.visible = false;
                        if(hand1) hand1.visible = false;
                        if(hand2) hand2.visible = false;
                    }

                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    let controllerHit = null;

                    if (activeInput === 'controller') {
                        const raycaster1 = new THREE.Raycaster();
                        raycaster1.setFromXRController(controller1, renderer.xr.getReferenceSpace());
                        const hitTestResults1 = renderer.xr.getSession().requestHitTest(raycaster1.ray, renderer.xr.getReferenceSpace());

                        const raycaster2 = new THREE.Raycaster();
                        raycaster2.setFromXRController(controller2, renderer.xr.getReferenceSpace());
                        const hitTestResults2 = renderer.xr.getSession().requestHitTest(raycaster2.ray, renderer.xr.getReferenceSpace());
                        
                        if (hitTestResults1.length > 0) {
                            controllerHit = hitTestResults1[0];
                            const controllerPose = controllerHit.getPose(renderer.xr.getReferenceSpace());
                            laser1.scale.y = controllerPose.transform.position.distanceTo(controller1.position);
                            laser1.visible = true;
                        } else {
                            laser1.scale.y = 10;
                            laser1.visible = true;
                        }

                        if (hitTestResults2.length > 0) {
                            controllerHit = hitTestResults2[0];
                            const controllerPose = controllerHit.getPose(renderer.xr.getReferenceSpace());
                            laser2.scale.y = controllerPose.transform.position.distanceTo(controller2.position);
                            laser2.visible = true;
                        } else {
                            laser2.scale.y = 10;
                            laser2.visible = true;
                        }
                        
                    } else { // Hand Tracking or None
                        if (hitTestResults.length > 0) {
                            controllerHit = hitTestResults[0];
                        }
                    }

                    if (controllerHit) {
                        reticle.visible = true;
                        const controllerPose = controllerHit.getPose(renderer.xr.getReferenceSpace());
                        reticle.matrix.fromArray(controllerPose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
