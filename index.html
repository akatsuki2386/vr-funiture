<!DOCTYPE html>
<html>
<head>
    <title>WebXR Plane Detection</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // A-Frameのコンポーネントとして平面検出を実装
        AFRAME.registerComponent('plane-detector', {
            init: function () {
                this.planes = new Map();
                this.session = null;
                this.frame = null;
                this.renderer = this.el.sceneEl.renderer;
                this.lastPlaneCount = 0;
                
                this.el.sceneEl.addEventListener('enter-vr', (e) => {
                    this.session = this.el.sceneEl.renderer.xr.getSession();
                    if (!this.session) {
                        console.warn("WebXR session not available.");
                        return;
                    }
                    
                    // 平面検出の設定
                    const sessionMode = this.session.mode;
                    const referenceSpace = this.el.sceneEl.renderer.xr.getReferenceSpace();

                    // XRPlaneDetectionFeatureの使用
                    if ('plane-detection' in this.session.requiredFeatures) {
                        this.session.requestLightEstimation().then(() => {
                            this.session.requestReferenceSpace({type: 'local-floor'}).then((refSpace) => {
                                this.el.sceneEl.renderer.xr.setReferenceSpace(refSpace);
                                this.session.requestAnimationFrame(this.onAnimationFrame.bind(this));
                                console.log("Plane detection requested.");
                            }).catch((err) => {
                                console.error("Failed to get reference space: ", err);
                            });
                        }).catch((err) => {
                            console.error("Failed to request light estimation: ", err);
                        });
                    } else {
                        console.warn("Plane detection feature not available in this session.");
                    }
                });

                this.el.sceneEl.addEventListener('exit-vr', (e) => {
                    this.planes.forEach(p => p.remove());
                    this.planes.clear();
                    this.session = null;
                    this.frame = null;
                });
            },

            tick: function (t, dt) {
                if (!this.session || !this.frame) {
                    return;
                }
                
                // 平面検出の更新
                const detectedPlanes = this.frame.detectedPlanes;
                if (!detectedPlanes) {
                    return;
                }

                // 新しい平面の検出
                detectedPlanes.forEach((plane) => {
                    if (!this.planes.has(plane.uuid)) {
                        const planeEntity = document.createElement('a-entity');
                        const material = new THREE.MeshPhongMaterial({
                            color: Math.random() * 0xffffff,
                            opacity: 0.5,
                            transparent: true,
                            side: THREE.DoubleSide
                        });

                        const geometry = new THREE.BufferGeometry();
                        geometry.setFromPoints(plane.polygon);
                        geometry.computeVertexNormals();

                        const mesh = new THREE.Mesh(geometry, material);
                        planeEntity.setObject3D('mesh', mesh);
                        this.el.appendChild(planeEntity);
                        this.planes.set(plane.uuid, planeEntity);
                    }
                });

                // 検出された平面の更新
                this.planes.forEach((planeEntity, uuid) => {
                    const plane = this.frame.detectedPlanes.get(uuid);
                    if (plane) {
                        // 平面の位置と向きを更新
                        const pose = this.frame.getPose(plane.planeSpace, this.el.sceneEl.renderer.xr.getReferenceSpace());
                        if (pose) {
                            planeEntity.object3D.position.copy(pose.transform.position);
                            planeEntity.object3D.quaternion.copy(pose.transform.orientation);
                        }
                    } else {
                        // 平面が消えた場合
                        planeEntity.remove();
                        this.planes.delete(uuid);
                    }
                });

                if (this.lastPlaneCount !== this.planes.size) {
                    console.log("Detected planes: ", this.planes.size);
                    this.lastPlaneCount = this.planes.size;
                }
            },
            
            // XRセッションからのフレーム更新
            onAnimationFrame: function(time, frame) {
                this.frame = frame;
                this.session.requestAnimationFrame(this.onAnimationFrame.bind(this));
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="xr-mode: immersive-ar" 
             plane-detector>
        <a-entity camera position="0 1.6 0"></a-entity>
        <a-light type="ambient" color="#888"></a-light>
        <a-light type="directional" position="-1 1 1"></a-light>
    </a-scene>
</body>
</html>
